<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <title>Интерактивный прототип приложения</title>
    <link rel="stylesheet" href="./styles.css?v=20260818-3" />
  </head>
  <body>
    <main id="prototype" class="prototype" aria-label="Интерактивный прототип мобильного приложения">
      <section id="stage" class="stage" aria-live="off">
        <img id="screen" class="screen" alt="Экран мобильного приложения" draggable="false" />
        <div id="screen-layer" class="screen-layer" hidden>
          <img id="screen-overlay" class="screen-overlay" alt="" draggable="false" />
          <span class="screen-notch" aria-hidden="true"></span>
        </div>
        <div id="hotspots" class="hotspots" aria-label="Активные области экрана"></div>
        <p id="error" class="error" hidden>Не удалось загрузить экран. Обновите страницу.</p>
      </section>
      <p id="status" class="visually-hidden" aria-live="polite"></p>
    </main>
    <noscript>Для работы интерактивного прототипа необходимо включить JavaScript.</noscript>
    <script src="./data.js?v=20260818-3"></script>
    <script src="./app.js?v=20260818-3"></script>
  </body>
</html>
